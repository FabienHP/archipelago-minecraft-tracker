license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# The tracker reads the randomizer's state, so it loads after it.
[[dependencies."${mod_id}"]]
modId="aprandomizer"
type="required"
versionRange="${aprandomizer_version_range}"
ordering="AFTER"
side="BOTH"
