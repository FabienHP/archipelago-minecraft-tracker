org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft and NeoForge versions the mod is built for. They must match the randomizer mod's.
minecraft_version=26.2
minecraft_version_range=[26.2,)
neo_version=26.2.0.88
neo_version_range=[26.2.0.88,)

mod_id=aptracker
mod_name=Archipelago Advancement Tracker
mod_version=0.1.0+26.2
mod_license=MIT
mod_authors=Fabien
mod_description=Shows which Archipelago checks are doable right now, on top of the Archipelago randomizer mod.
# Versions of the randomizer mod (aprandomizer) this tracker reads its state from
aprandomizer_version_range=[2.2,)

# Reference files the build and the tests read (see reference/)
apworld_file=reference/minecraft.apworld
aprandomizer_jar=reference/aprandomizer-2.2.1-26.2.jar
